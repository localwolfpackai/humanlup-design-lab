<style>
:root{
  --g:#edeae3;
  --ink:#191714;
  --eye:#f6f4ef;
  --a:#c2410c;
  --mute:rgba(25,23,20,.66);
  --line:rgba(25,23,20,.26);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--g);color:var(--ink);
  font-family:"Instrument Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent}
canvas:focus-visible{outline:2px solid var(--a);outline-offset:-6px}
.ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:max(20px,env(safe-area-inset-top));left:28px;right:28px;
  display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;letter-spacing:-.01em}
.block{position:absolute;left:28px;top:50%;transform:translateY(-50%);max-width:430px}
h1{font-size:clamp(58px,8.4vw,132px);font-weight:700;letter-spacing:-.055em;line-height:.86}
.block p{margin-top:18px;font-size:clamp(16px,1.3vw,19px);line-height:1.4;color:var(--mute);max-width:330px}
.by{margin-top:26px;font-size:12px;font-weight:500;color:var(--mute)}
.ck{position:absolute;left:0;right:0;bottom:0;height:12px;
  background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/24px 24px}
@media (max-width:760px){
  .top{left:18px;right:18px}
  .block{left:18px;right:18px;top:auto;bottom:46px;transform:none;max-width:none}
  .block p{max-width:300px;margin-top:12px}
  .by{margin-top:18px}
  h1{font-size:clamp(54px,17vw,86px)}
}

<body>
<canvas id="c" tabindex="0" role="img" aria-label="A crowd of small faces whose eyes follow the pointer"></canvas>
<div class="ui">
  <div class="top"><span>HumanLup</span></div>
  <div class="block">
    <h1>Nosy</h1>
    <p>They follow your cursor. Sit still and they drift off.</p>
    <div class="by">Built by Lupo</div>
  </div>
  <div class="ck"></div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK = '#191714', EYE = '#f6f4ef', ACC = '#c2410c';

let W = 0, H = 0, faces = [], hole = null;
let px = -9999, py = -9999, lastMove = -9999, pulses = [], everMoved = false;

const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };

function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pad = W < 760 ? 14 : 26;
  const box = (el, p) => { const r = el.getBoundingClientRect();
    return { x: r.left - p, y: r.top - p, r: r.right + p, b: r.bottom + p }; };
  const holes = [box(document.querySelector('.block'), pad),
                 box(document.querySelector('.top span'), 16)];
  hole = holes[0];
  const clear = (x, y, half) => holes.every(h =>
    x + half <= h.x || x - half >= h.r || y + half <= h.y || y - half >= h.b);

  const target = W < 520 ? 62 : W < 900 ? 74 : 86;
  const cols = Math.max(4, Math.round(W / target));
  const cell = W / cols;
  const rows = Math.max(3, Math.round((H - 16) / cell));
  const top = (H - 12 - rows * cell) / 2;
  const s = cell * 0.74;

  faces = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = cell * (c + 0.5), y = top + cell * (r + 0.5);
    const half = s / 2 + 2;
    if (!clear(x, y, half)) continue;
    if (y + half > H - 10) continue;
    faces.push({ x, y, s, lx: x, ly: y, open: 1, aw: 0, wake: 0,
      blink: performance.now() + 1500 + Math.random() * 9000, bt: 0,
      ph: Math.random() * 7, hot: 0,
      gl: performance.now() + 4000 + Math.random() * 12000, gx: 0, gy: 0, gt: 0 });
  }
}

function pointer(x, y, tap) {
  px = x; py = y; lastMove = performance.now(); everMoved = true;
  if (tap) pulses.push({ x, y, t: lastMove });
  if (pulses.length > 4) pulses.shift();
}

addEventListener('resize', layout);
addEventListener('pointermove', e => pointer(e.clientX, e.clientY, false));
addEventListener('pointerdown', e => pointer(e.clientX, e.clientY, true));
addEventListener('keydown', e => {
  const step = e.shiftKey ? 90 : 34;
  let x = px < 0 ? W / 2 : px, y = py < 0 ? H / 2 : py, hit = true;
  if (e.key === 'ArrowLeft') x -= step; else if (e.key === 'ArrowRight') x += step;
  else if (e.key === 'ArrowUp') y -= step; else if (e.key === 'ArrowDown') y += step;
  else hit = false;
  if (hit) { e.preventDefault(); pointer(Math.max(0, Math.min(W, x)), Math.max(0, Math.min(H, y)), false); }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pointer(x, y, true); }
});

let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05); prev = now;
  const idle = (now - lastMove) / 1000;
  const far = Math.hypot(W, H);

  ctx.clearRect(0, 0, W, H);

  let nearest = null, nd = 1e9;
  for (const f of faces) {
    const d = Math.hypot(f.x - px, f.y - py);
    if (d < nd) { nd = d; nearest = f; }
  }
  for (const f of faces) {
    const d = Math.hypot(f.x - px, f.y - py);

    // every so often one looks at a neighbour instead of you
    if (!calm && now > f.gl && f.aw > 0.6 && idle > 0.7) {
      const n = faces[(faces.indexOf(f) + (Math.random() < 0.5 ? -1 : 1) * (1 + ((Math.random() * 3) | 0)) + faces.length) % faces.length];
      f.gx = n.x; f.gy = n.y; f.gt = now + 700 + Math.random() * 900;
      f.gl = now + 7000 + Math.random() * 14000;
    }
    const looking = now < f.gt;
    const tx = looking ? f.gx : px, ty = looking ? f.gy : py;

    // gaze lags by distance, so a wave crosses the crowd
    const tau = calm ? 0.04 : looking ? 0.09 : 0.05 + (d / far) * 0.5;
    const k = 1 - Math.exp(-dt / tau);
    f.lx += (tx - f.lx) * k; f.ly += (ty - f.ly) * k;

    // the far ones give up on you first
    const hold = 2.4 + (1 - Math.min(d / far, 1)) * 2.2;
    if (idle < 0.05) f.wake = now + (calm ? 0 : d * 0.55);
    const want = (!everMoved || idle > hold) ? 0 : (now >= f.wake ? 1 : 0);
    f.aw += (want - f.aw) * (1 - Math.exp(-dt / (want ? 0.12 : 0.5)));

    // blink
    if (now > f.blink) { f.bt = now; f.blink = now + 2600 + Math.random() * 9000; }
    const bl = now - f.bt < 150 ? Math.abs(Math.cos((now - f.bt) / 150 * Math.PI)) : 1;

    let pop = 0, wide = 0;
    for (const p of pulses) {
      const age = (now - p.t) / 1000; if (age > 1.3) continue;
      const ring = age * 950, gap = Math.abs(Math.hypot(f.x - p.x, f.y - p.y) - ring);
      const g = Math.exp(-(gap * gap) / 3600) * (1 - age / 1.3);
      pop += g; wide = Math.max(wide, g);
    }

    const isHot = f === nearest && nd < f.s * 1.1 && f.aw > 0.5;
    f.hot += ((isHot ? 1 : 0) - f.hot) * (1 - Math.exp(-dt / 0.14));

    const bob = calm ? 0 : Math.sin(now / 1400 + f.ph) * 1.6 * f.aw;
    const s = f.s * (1 + f.hot * 0.07 + pop * 0.12);
    const open = Math.max(0.055, f.aw * bl);

    ctx.save();
    ctx.translate(f.x, f.y + bob);

    ctx.fillStyle = f.hot > 0.02 ? mix(INK, ACC, f.hot) : INK;
    rr(-s / 2, -s / 2, s, s, s * 0.3); ctx.fill();

    const ex = s * 0.185, ey = -s * 0.015;
    const erx = s * 0.112, ery = s * 0.152 * open;
    const prr = s * 0.062 * (1 + wide * 0.45);

    for (const sx of [-1, 1]) {
      const cx = sx * ex;
      ctx.fillStyle = EYE;
      ctx.beginPath(); ctx.ellipse(cx, ey, erx, Math.max(ery, s * 0.012), 0, 0, Math.PI * 2); ctx.fill();
      if (open > 0.3) {
        const dx = f.lx - (f.x + cx), dy = f.ly - (f.y + ey);
        const m = Math.max(Math.hypot(dx, dy), 1);
        const rx = Math.max(erx - prr - 1, 0), ry = Math.max(ery - prr - 1, 0);
        const ox = (dx / m) * rx * Math.min(m / 170, 1), oy = (dy / m) * ry * Math.min(m / 170, 1);
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.ellipse(cx + ox, ey + oy, prr, prr, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(246,244,239,.85)';
        ctx.beginPath(); ctx.ellipse(cx + ox - prr * 0.32, ey + oy - prr * 0.34, prr * 0.26, prr * 0.26, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

function mix(a, b, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}

layout();
document.fonts.ready.then(layout);
requestAnimationFrame(frame);
})();
</script>
</body>
