<style>
*{box-sizing:border-box;margin:0;padding:0}

body{background:var(--g);color:var(--i);font:500 15px/1.3 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto 1fr auto auto;height:100dvh;min-height:540px;overflow:hidden}

#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#grip{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;cursor:nwse-resize;touch-action:none;display:grid;place-items:center}

#read{position:absolute;left:0;top:0;font:500 12px 'Geist Mono',ui-monospace,monospace;color:var(--m);white-space:nowrap;pointer-events:none;letter-spacing:.02em}

#bar{display:flex;align-items:center;gap:12px;padding:10px 28px 16px;flex-wrap:wrap}

<body>
<header><b>HumanLup</b><h1>One Card</h1><p>One card that holds at any shape. Drag the corner.</p></header>

<div id="stage">
  <canvas id="cv" aria-label="A social card that reflows as its shape changes"></canvas>
  <div id="read"></div>
  <button id="grip" aria-label="Resize the card. Arrow keys work too."><i></i></button>
</div>

<div id="bar">
  <div class="seg" role="group" aria-label="Size">
    <button data-s="link"><em style="width:19px;height:10px"></em>Link</button>
    <button data-s="feed"><em style="width:12px;height:15px"></em>Feed</button>
    <button data-s="story"><em style="width:9px;height:16px"></em>Story</button>
  </div>
  <div class="who">
    <button id="prev" aria-label="Previous brand"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <span><span id="nm"></span><small id="ct"></small></span>
    <button id="next" aria-label="Next brand"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <input id="hd" maxlength="64" aria-label="Headline" spellcheck="false" autocomplete="off">
  <button id="save"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>Save PNG</span></button>
</div>
<footer><span>Built by Lupo</span><span>Made-up brands</span></footer>
<div class="ck"></div>

<script>
const BR=[
 {n:'Slow Pour',m:'Winter roast · out Friday',h:'Dark, sweet and in no hurry.',f:'"Source Serif 4"',w:600,g:'#efe4d2',i:'#2a1d14',p:'#c8692c',q:'#f6ead8',k:'sun'},
 {n:'Loose Change',m:'Budgets that add up',h:'Know where it went.',f:'"Geist Mono"',w:600,g:'#f5f6f3',i:'#0e1a14',p:'#0e1a14',q:'#7df0a8',k:'bars',lh:1.08},
 {n:'Third Shift',m:'Episode 41 · new tonight',h:'Radio for people who are still up.',f:'Archivo',w:800,g:'#14110d',i:'#f6ead6',p:'#1e1811',q:'#ffb347',k:'wave',lh:.98},
 {n:'Lane Six',m:'Open swim · 6 am',h:'First one in gets the flat water.',f:'"Bricolage Grotesque"',w:700,g:'#e7f1f4',i:'#0b2a3a',p:'#1479a8',q:'#e7f1f4',k:'water'},
 {n:'Long Table',m:'Supper club · Saturdays',h:'Twelve seats. One menu. Come hungry.',f:'"Source Serif 4"',w:500,g:'#2f3a22',i:'#f1ecd9',p:'#3a472a',q:'#d9c77a',k:'dots'},
 {n:'Footnote',m:'Weekly letter · No. 118',h:'Notes from the edge of the page.',f:'"Source Serif 4"',w:700,g:'#faf8f3',i:'#161616',p:'#efeadf',q:'#d6231a',k:'rules'},
 {n:'Null Island',m:'Dev conference · May 9',h:'Meet us at zero, zero.',f:'"Space Grotesk"',w:700,g:'#0c0d0b',i:'#f1f3ea',p:'#0c0d0b',q:'#c9f24a',k:'grid'},
 {n:'Lantern',m:'Studio · new work',h:'Leave a light on.',f:'Archivo',w:900,g:'#1c3fd6',i:'#ffffff',p:'#1c3fd6',q:'#ffffff',k:'rings',lh:.94},
];
const PRE={link:[1200,630,'Link'],feed:[1080,1350,'Feed'],story:[1080,1920,'Story']};
const $=s=>document.querySelector(s), cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const stage=$('#stage'),cv=$('#cv'),cx=cv.getContext('2d'),grip=$('#grip'),read=$('#read');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let SW=0,SH=0,DPR=1,bi=0,active='feed',drag=false,first=true,born=0;
const card={w:0,h:0,vw:0,vh:0,tw:0,th:0};
let ws=[],mot=null;

/* measuring */
const mx=document.createElement('canvas').getContext('2d');

/* where everything goes, for any width and height */
function targets(b,w,h){
  const a=w/h,u=Math.sqrt(w*h),pad=u*.062,sm=u*.036;let m,tx;
  if(a>=1.3){const s=w*(.40+.06*cl((a-1.3)/1.1));m=[w-s,0,s,h];tx=[pad,pad,w-s-pad*2,h-pad*2]}
  else{const s=h*(.36+.14*cl((1.3-a)/.75));m=[0,h-s,w,s];tx=[pad,pad,w-pad*2,h-s-pad*2]}
  const top=tx[1]+sm*2.3,bot=tx[1]+tx[3]-sm*2,ah=Math.max(4,bot-top),aw=tx[2],lh=b.lh||1.02;
  const words=(b.h.trim()||' ').split(/\s+/);
  /* measured at the real size each time: these faces change shape as they grow */
  const wrap=s=>{mx.font=`${b.w} ${s}px ${b.f}, sans-serif`;const sp=mx.measureText(' ').width;let x=0,line=0;const out=[];for(let i=0;i<words.length;i++){const ww=mx.measureText(words[i]).width;if(ww>aw)return null;if(x>0&&x+ww>aw){line++;x=0}out.push([x,line]);x+=ww+sp}return (line+1)*lh*s<=ah?out:null};
  let lo=2,hi=u*.36,best=wrap(lo)||words.map(()=>[0,0]);
  for(let k=0;k<16;k++){const mid=(lo+hi)/2,r=wrap(mid);if(r){lo=mid;best=r}else hi=mid}
  const s=lo,n=best.length?best[best.length-1][1]+1:1,y0=bot-n*lh*s;
  return{m,tx,sm,pad,ws:words.map((t,i)=>({t,x:tx[0]+best[i][0],y:y0+best[i][1]*lh*s+s*.8,s}))};
}

/* the pictures: shapes only, each fills whatever room it is given */
const K={
 sun(g,x,y,w,h,t,b){const R=Math.hypot(w/2,h),cx=x+w/2,cy=y+h;g.strokeStyle=b.q;g.lineWidth=Math.min(w,h)*.012;
  for(let i=1;i<=9;i++){g.globalAlpha=.2+.8*(1-i/9);g.beginPath();g.arc(cx,cy,R*(i/9)*(1+.025*Math.sin(t*.8+i*.7)),0,7);g.stroke()}
  g.globalAlpha=1;g.fillStyle=b.q;g.beginPath();g.arc(cx,cy,Math.min(w,h)*.2*(1+.03*Math.sin(t)),0,7);g.fill()},
 bars(g,x,y,w,h,t,b){const n=9,p=Math.min(w,h)*.12,bw=(w-p*2)/(n*1.5-.5);g.fillStyle=b.q;
  for(let i=0;i<n;i++){const v=.22+.7*(.5+.5*Math.sin(t*.9+i*1.3)*Math.cos(i*.7+t*.31));const bh=(h-p*2)*v;g.globalAlpha=i===n-1?1:.38;g.fillRect(x+p+i*bw*1.5,y+h-p-bh,bw,bh)}g.globalAlpha=1},
 wave(g,x,y,w,h,t,b){const m=Math.min(w,h),st=m*.05,n=Math.floor((w-m*.2)/st),x0=x+(w-(n-1)*st)/2;g.strokeStyle=b.q;g.lineWidth=m*.016;g.lineCap='round';
  for(let i=0;i<n;i++){const e=Math.sin(Math.PI*(i+.5)/n),a=h*.36*e*(.25+.75*Math.abs(Math.sin(t*1.7+i*.55)*Math.sin(i*.23+t*.6)));g.beginPath();g.moveTo(x0+i*st,y+h/2-a);g.lineTo(x0+i*st,y+h/2+a);g.stroke()}},
 water(g,x,y,w,h,t,b){const m=Math.min(w,h),n=9;g.strokeStyle=b.q;g.lineWidth=m*.016;g.lineCap='round';
  for(let r=0;r<n;r++){const yy=y+h*(r+1)/(n+1),a=m*.03*(1-r/(n*1.4));g.globalAlpha=.35+.65*(r/n);g.beginPath();for(let k=0;k<=40;k++){const px=x+w*k/40,py=yy+a*Math.sin(px/m*7+t*1.2+r*.9);k?g.lineTo(px,py):g.moveTo(px,py)}g.stroke()}g.globalAlpha=1},
 dots(g,x,y,w,h,t,b){const m=Math.min(w,h),c=m/6.5,co=Math.ceil(w/c)+1,ro=Math.ceil(h/c)+1,ox=x+(w-(co-1)*c)/2,oy=y+(h-(ro-1)*c)/2;g.fillStyle=b.q;
  for(let j=0;j<ro;j++)for(let i=0;i<co;i++){const d=Math.hypot(i-(co-1)/2,j-(ro-1)/2);g.beginPath();g.arc(ox+i*c,oy+j*c,c*.5*(.22+.6*(.5+.5*Math.sin(d*.95-t*1.4))),0,7);g.fill()}},
 rules(g,x,y,w,h,t,b){const m=Math.min(w,h),p=m*.13,st=m*.085,n=Math.floor((h-p*2)/st),hot=Math.floor(t*.5)%Math.max(1,n);
  g.fillStyle=b.q;g.fillRect(x+p,y+p,m*.012,h-p*2);
  for(let i=0;i<n;i++){const r=Math.abs(Math.sin(i*12.9898)*43758.5453)%1,len=(w-p*2.6)*(i%5===4?.35:.62+.38*r);g.fillStyle=i===hot?b.q:b.i;g.globalAlpha=i===hot?1:.2;g.fillRect(x+p*1.6,y+p+i*st+st*.3,len,m*.024)}g.globalAlpha=1},
 grid(g,x,y,w,h,t,b){const m=Math.min(w,h),c=m/6,co=Math.ceil(w/c),ro=Math.ceil(h/c),ox=x+(w-co*c)/2,oy=y+(h-ro*c)/2,k=Math.floor(t*1.1);
  const hx=Math.floor(Math.abs(Math.sin(k*7.13)*9999)%co),hy=Math.floor(Math.abs(Math.sin(k*3.71)*9999)%ro);
  g.fillStyle=b.q;g.fillRect(ox+hx*c,oy+hy*c,c,c);g.strokeStyle=b.q;g.globalAlpha=.26;g.lineWidth=Math.max(1,m*.004);g.beginPath();
  for(let i=0;i<=co;i++){g.moveTo(ox+i*c,y);g.lineTo(ox+i*c,y+h)}for(let j=0;j<=ro;j++){g.moveTo(x,oy+j*c);g.lineTo(x+w,oy+j*c)}g.stroke();g.globalAlpha=1},
 rings(g,x,y,w,h,t,b){const m=Math.min(w,h),cx=x+w/2,cy=y+h*.52,R=Math.hypot(w,h)*.62;g.strokeStyle=b.q;g.lineWidth=m*.012;
  for(let k=0;k<7;k++){const p=((t*.14+k/7)%1+1)%1;g.globalAlpha=(1-p)*.9;g.beginPath();g.arc(cx,cy,m*.07+p*R,0,7);g.stroke()}
  g.globalAlpha=1;g.fillStyle=b.q;g.beginPath();g.arc(cx,cy,m*.07,0,7);g.fill()}
};

function drawCard(g,w,h,b,T,words,m,t,fade){
  g.fillStyle=b.g;g.fillRect(0,0,w,h);
  g.save();g.beginPath();g.rect(m[0],m[1],m[2],m[3]);g.clip();g.fillStyle=b.p;g.fillRect(m[0],m[1],m[2],m[3]);K[b.k](g,m[0],m[1],m[2],m[3],t,b);g.restore();
  g.fillStyle=b.i;g.textBaseline='alphabetic';g.globalAlpha=fade;
  g.font=`700 ${T.sm}px ${b.f}, sans-serif`;g.fillText(b.n,T.tx[0],T.tx[1]+T.sm*.82);
  for(const o of words){g.font=`${b.w} ${o.s}px ${b.f}, sans-serif`;g.fillText(o.t,o.x,o.y+(o.dy||0))}
  g.globalAlpha=fade*.66;g.font=`500 ${T.sm*.92}px Inter, sans-serif`;g.fillText(b.m,T.tx[0],T.tx[1]+T.tx[3]-T.sm*.12);g.globalAlpha=1;
}

/* sizes */
function fit(key){const[W,H]=PRE[key],px=SW<700?16:60,py=SW<700?30:40,s=Math.min(Math.min(SW-px*2,1060)/W,Math.min(SH-py*2,800)/H);return[W*s,H*s]}
function dims(){if(active)return PRE[active].slice(0,2);const k=Math.sqrt(14e5/(card.tw*card.th));return[Math.round(card.tw*k/2)*2,Math.round(card.th*k/2)*2]}
function go(key,snap){active=key;[card.tw,card.th]=fit(key);if(snap||still){card.w=card.tw;card.h=card.th;card.vw=card.vh=0}ui()}
function free(w,h){
  const maxW=SW-(SW<700?24:80),maxH=SH-(SW<700?44:56);w=cl(w,150,maxW);h=cl(h,150,maxH);
  let a=cl(w/h,.5,2.4);active=null;
  for(const k in PRE){const pa=PRE[k][0]/PRE[k][1];if(Math.abs(Math.log(a/pa))<.04){a=pa;active=k}}
  if(w/a>maxH){h=maxH;w=h*a}else h=w/a;
  card.tw=card.w=w;card.th=card.h=h;card.vw=card.vh=0;ui()
}
function brand(n,keep){bi=(n+BR.length)%BR.length;const b=BR[bi];$('#nm').textContent=b.n;$('#ct').textContent=(bi+1)+'/'+BR.length;if(!keep)$('#hd').value=b.h;ws=[];born=performance.now();ui()}
function ui(){document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===active));
  const[W,H]=dims();read.innerHTML=`<b>${active?PRE[active][2]:'Free'}</b> · ${W} × ${H}`;
  if(!first)history.replaceState(null,'','#'+(bi+1)+(active?'-'+active:''))}

function size(){const r=stage.getBoundingClientRect();SW=r.width;SH=r.height;DPR=Math.min(2,devicePixelRatio||1);cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  if(active)go(active,true);else free(card.tw,card.th)}

let last=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;const b=BR[bi],t=still?2:now/1000;
  if(!drag){for(const[p,v,tg]of[['w','vw','tw'],['h','vh','th']]){card[v]+=((card[tg]-card[p])*190-card[v]*23)*dt;card[p]+=card[v]*dt}}
  const w=Math.max(60,card.w),h=Math.max(60,card.h),T=targets(b,w,h);
  if(ws.length!==T.ws.length||!mot){ws=T.ws.map(o=>({...o}));mot=T.m.slice()}
  const f=still?1:1-Math.exp(-dt*(drag?22:12));
  T.ws.forEach((o,i)=>{const c=ws[i];c.t=o.t;c.x+=(o.x-c.x)*f;c.y+=(o.y-c.y)*f;c.s+=(o.s-c.s)*f});
  for(let i=0;i<4;i++)mot[i]+=(T.m[i]-mot[i])*f;
  const age=still?1:cl((now-born)/420);ws.forEach((c,i)=>{const a=cl(age*1.6-i*.08);c.dy=(1-a)*(1-a)*c.s*.35});

  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,SW,SH);
  const ox=(SW-w)/2,oy=(SH-h)/2;
  cx.lineWidth=1;for(const k in PRE){const[fw,fh]=fit(k),on=k===active;cx.strokeStyle=`rgba(21,21,21,${on?.3:.09})`;cx.strokeRect(Math.round((SW-fw)/2)+.5,Math.round((SH-fh)/2)+.5,Math.round(fw),Math.round(fh))}
  cx.save();cx.translate(ox,oy);
  cx.shadowColor='rgba(20,18,14,.22)';cx.shadowBlur=44;cx.shadowOffsetY=18;cx.fillStyle=b.g;cx.beginPath();cx.roundRect(0,0,w,h,7);cx.fill();
  cx.shadowColor='transparent';cx.beginPath();cx.roundRect(0,0,w,h,7);cx.clip();
  drawCard(cx,w,h,b,T,ws,mot,t,cl(age*2));
  cx.restore();
  grip.style.transform=`translate(${ox+w}px,${oy+h}px)`;
  read.style.transform=`translate(${ox}px,${Math.min(SH-16,oy+h+9)}px)`;
  requestAnimationFrame(frame);
}

/* hands */
let tour=[];const stop=()=>{tour.forEach(clearTimeout);tour=[]};
grip.addEventListener('pointerdown',e=>{stop();drag=true;grip.classList.add('on');grip.setPointerCapture(e.pointerId);e.preventDefault()});
grip.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();free(Math.abs(e.clientX-r.left-SW/2)*2,Math.abs(e.clientY-r.top-SH/2)*2)});
const up=()=>{drag=false;grip.classList.remove('on')};grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
grip.addEventListener('keydown',e=>{const d={ArrowRight:[24,0],ArrowLeft:[-24,0],ArrowDown:[0,24],ArrowUp:[0,-24]}[e.key];if(!d)return;stop();e.preventDefault();e.stopPropagation();free(card.tw+d[0],card.th+d[1])});
