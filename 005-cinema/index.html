<style>
:root{
  --bg:#060608; --panel:rgba(14,14,20,.82); --solid:#0e0e14;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.22);
  --ink:rgba(255,255,255,.94); --dim:rgba(255,255,255,.64);
  --accent:#ff8a4c; --on-accent:#06060a;
  --display:"Mona Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --panel-w:420px; --strip-h:112px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
.bar{position:fixed;left:0;right:0;height:0;z-index:3;background:#000;pointer-events:none;transition:height 1.1s cubic-bezier(.7,0,.3,1)}
.bar.t{top:0}.bar.b{bottom:0}
body.playing .bar{height:clamp(20px,7vh,76px)}

/* ---------- titles ---------- */
#titles{position:fixed;inset:0;z-index:4;pointer-events:none;display:flex;align-items:center;
  padding:0 8vw;transition:right .5s cubic-bezier(.2,.7,.2,1),bottom .5s cubic-bezier(.2,.7,.2,1)}
#titles.L{justify-content:flex-start;text-align:left}
#titles.R{justify-content:flex-end;text-align:right}
#titles.C{justify-content:center;text-align:center}
#line{font-family:var(--display);font-weight:420;font-stretch:100%;font-size:clamp(28px,4.5vw,72px);line-height:1.1;letter-spacing:-.012em;
  max-width:15ch;text-wrap:balance;color:#fff;text-shadow:0 2px 36px rgba(0,0,0,.75),0 0 4px rgba(0,0,0,.35);will-change:transform,filter}
#titles.L #line{transform-origin:0 50%}#titles.R #line{transform-origin:100% 50%}
#line.hero{font-size:clamp(34px,6.4vw,104px);font-weight:640;font-stretch:112%;max-width:14ch;letter-spacing:-.02em}
#line span{display:inline-block;white-space:pre;will-change:opacity,transform}
#card{position:fixed;inset:0;z-index:4;pointer-events:none;display:grid;place-items:center;text-align:center;padding:0 6vw;
  transition:right .5s cubic-bezier(.2,.7,.2,1),bottom .5s cubic-bezier(.2,.7,.2,1)}
#card h1{font-family:var(--display);font-weight:760;font-stretch:125%;text-transform:uppercase;font-size:clamp(40px,10.5vw,176px);
  line-height:.92;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 2px 50px rgba(0,0,0,.6)}
#card p{margin-top:clamp(14px,2vw,26px);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
#bigplay{pointer-events:auto;margin-top:clamp(22px,3vw,40px);display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px 0 22px;
  border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  transition:transform .15s,box-shadow .2s,background .6s}
#bigplay:hover{box-shadow:0 0 34px -4px var(--accent)}#bigplay:active{transform:scale(.97)}
#bigplay svg{fill:currentColor;stroke:none}
body.started #bigplay{display:none}

/* ---------- chrome ---------- */
.chrome{transition:opacity .45s ease,transform .45s ease,right .5s cubic-bezier(.2,.7,.2,1)}
body.playing.idle .chrome{opacity:0;pointer-events:none}
body.playing.idle{cursor:none}
#mark{position:fixed;z-index:6;top:max(18px,env(safe-area-inset-top));left:clamp(16px,2.4vw,30px);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#mark b{font-weight:500;color:var(--ink)}
#strip{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:0 clamp(12px,2.4vw,30px) max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(4,4,6,.86),rgba(4,4,6,.55) 60%,transparent)}
#transport{display:flex;align-items:center;gap:6px;height:52px}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 12px;border-radius:10px;border:1px solid transparent;background:transparent;
  color:var(--ink);font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:background .15s,border-color .15s,color .15s}
.tb:hover{background:rgba(255,255,255,.08)}
.tb[aria-pressed="true"]{border-color:var(--line2);background:rgba(255,255,255,.08)}
#b-play{background:var(--accent);color:var(--on-accent);border-radius:999px;width:44px;padding:0;transition:background .6s}
#b-play svg{fill:currentColor;stroke:none}
#b-rec.on{color:#ff6b6b;border-color:rgba(255,107,107,.5)}
#b-rec.on svg{fill:currentColor}
#tc{font-size:13px;letter-spacing:.06em;color:var(--ink);margin:0 10px 0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#tc i{font-style:normal;color:var(--dim)}
#now{flex:1;min-width:0;font-size:12px;letter-spacing:.04em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tl{position:relative;height:48px;border-radius:8px;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
#tl canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:8px}
#head{position:absolute;top:-3px;bottom:-3px;left:0;width:2px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 12px rgba(255,255,255,.7);pointer-events:none}
#tip{position:absolute;bottom:58px;left:0;transform:translateX(-50%);max-width:min(320px,80vw);padding:8px 12px;border-radius:8px;background:var(--solid);border:1px solid var(--line2);
  font-family:var(--display);font-size:14px;line-height:1.3;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .15s;white-space:normal;text-align:center;width:max-content}
#tl:hover #tip.has{opacity:1}
#toast{position:fixed;z-index:30;left:50%;bottom:140px;transform:translateX(-50%) translateY(8px);padding:10px 16px;border-radius:10px;background:var(--solid);border:1px solid var(--line2);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- script panel (the source's glass card, kept) ---------- */
#panel{position:fixed;z-index:20;top:14px;right:14px;bottom:14px;width:calc(var(--panel-w) - 14px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  -webkit-backdrop-filter:blur(30px) saturate(1.2);backdrop-filter:blur(30px) saturate(1.2);box-shadow:0 40px 100px -30px rgba(0,0,0,.85);
  transform:translateX(calc(100% + 30px));visibility:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s .5s}
body.script #panel{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
body.script #strip,body.script #titles,body.script #card{right:var(--panel-w)}
#panel header{display:flex;align-items:center;gap:10px;padding:14px 12px 10px 20px}
#panel h2{flex:1;font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
#p-body{flex:1;overflow-y:auto;padding:4px 20px 20px;overscroll-behavior:contain}
.lab{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
#films{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim);font-size:12px;letter-spacing:.04em;transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
#f-title{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.32);font-family:var(--display);font-size:17px;font-weight:600;outline-offset:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:rgba(0,0,0,.25)}
.seg button{flex:1;height:40px;border:0;background:transparent;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
#shots{list-style:none;display:flex;flex-direction:column;gap:8px}
.shot{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28);transition:border-color .2s}
.shot.sel{border-color:var(--sa,var(--accent))}
.shot .top{display:flex;align-items:flex-start;gap:10px;padding:10px 12px 8px}
.shot .n{flex:none;width:26px;padding-top:5px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.shot .n u{display:block;width:14px;height:3px;border-radius:2px;background:var(--sa)}
.shot textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;font-family:var(--display);font-size:17px;line-height:1.35;outline:none;overflow:hidden;padding:2px 0}
.shot.hero textarea{font-weight:650}
.shot .d{flex:none;padding-top:5px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.shot .ctl{display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 10px 10px 10px}
.shot.sel .ctl{display:flex}
.sw{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center}
.sw i{display:block;width:20px;height:20px;border-radius:50%;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--c);background:rgba(255,255,255,.06)}
.ctl .mn{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);width:100%;padding:0 4px 2px}
.ctl .sp{flex:1}
.mini{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.mini:hover{color:var(--ink);border-color:var(--line2)}
.mini[aria-pressed="true"]{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.08)}
.mini[aria-pressed="true"] svg{fill:currentColor}
.mini svg.i{width:16px;height:16px}
#add{width:100%;justify-content:center;margin-top:8px;height:44px}
#p-foot{padding:12px 20px 16px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.06em;color:var(--dim);line-height:1.6}
#p-foot b{color:var(--ink);font-weight:500}

@media (max-width:760px){
  :root{--strip-h:150px}
  #titles{align-items:flex-end;padding:0 22px calc(var(--strip-h) + 56px)}
  #line{font-size:clamp(30px,8.6vw,44px);max-width:13ch}
  #line.hero{font-size:clamp(36px,10.6vw,54px);max-width:11ch}
  #card{padding-bottom:60px}
  #card p,#mark{font-size:14px}
  #transport{flex-wrap:wrap;height:auto;row-gap:2px;padding-bottom:6px}
  #now{order:9;flex-basis:100%;font-size:14px;padding:2px 2px 4px}
  .tb{font-size:14px}.tb span{display:none}
  #tc{font-size:14px;margin-right:auto}
  #tl{height:56px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:62vh;height:62dvh;border-radius:18px 18px 0 0;border-width:1px 0 0;transform:translateY(105%)}
  body.script #strip,body.script #titles,body.script #card{right:0}
  body.script #strip{opacity:0;pointer-events:none}
  body.script #titles,body.script #card{bottom:62vh;bottom:62dvh}
  body.script #titles{padding-bottom:22px}
  body.script #card{padding-bottom:0}
  body.script #line{font-size:26px}body.script #line.hero{font-size:30px}
  body.script #card h1{font-size:11vw}
  .lab,.chip,.seg button,.mini,.ctl .mn,.shot .n,.shot .d,#p-foot,#panel h2{font-size:14px}
  .chip{height:44px;padding:0 14px}.seg button{height:44px}
  .sw{width:44px;height:44px}.mini{height:44px}
  .shot .ctl{gap:4px;padding:2px 8px 10px}
  .shot textarea,#f-title{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.bar,#panel,#titles,#card,.chrome{transition:none}}
</style>

<script>
"use strict";
/* =====================================================================
   CINEMA
   The film is a function of time. state(t) gives the figure, the color,
   the light, the camera and the words for any second, so it can be
   paused, scrubbed, cut and recorded. Each line holds for as long as it
   takes to read. Each line's color is the writer's choice.
   ===================================================================== */
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a||1e-6),0,1);return t*t*(3-2*t)};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow=()=>innerWidth<=760;

/* ---------- moods: the six ramps, accents and chords from the source, unchanged ---------- */
const MOODS=[
 {name:'Drift',accent:'#4dffd0',chord:[110,164.81,220,329.63],stops:[[0,[4,8,14]],[.3,[16,70,86]],[.54,[30,170,150]],[.74,[120,240,180]],[.9,[200,160,255]],[1,[245,235,255]]]},
 {name:'Dusk', accent:'#ff8a4c',chord:[98,146.83,196,261.63],stops:[[0,[6,3,6]],[.32,[70,16,24]],[.6,[190,56,38]],[.82,[255,138,52]],[1,[255,232,190]]]},
 {name:'Cold', accent:'#7fd3ff',chord:[123.47,185,246.94,369.99],stops:[[0,[3,6,14]],[.34,[18,40,92]],[.6,[40,120,196]],[.82,[120,210,255]],[1,[236,248,255]]]},
 {name:'Noir', accent:'#cfd2dd',chord:[110,130.81,196,293.66],stops:[[0,[5,5,7]],[.5,[78,78,90]],[.8,[176,176,190]],[1,[250,250,255]]]},
 {name:'Bloom',accent:'#ff6cae',chord:[130.81,196,261.63,392],stops:[[0,[8,4,12]],[.28,[64,18,72]],[.5,[150,42,120]],[.7,[240,80,140]],[.86,[255,150,120]],[1,[255,240,220]]]},
 {name:'Deep', accent:'#6f7cff',chord:[82.41,123.47,164.81,246.94],stops:[[0,[3,3,10]],[.34,[22,20,70]],[.6,[60,56,160]],[.82,[120,130,240]],[1,[220,228,255]]]},
];
const DRIFT=0,DUSK=1,COLD=2,NOIR=3,BLOOM=4,DEEP=5;
const LUT=new Uint8Array(256*MOODS.length*4);
MOODS.forEach((m,r)=>{for(let i=0;i<256;i++){const t=i/255,s=m.stops;let c=s[s.length-1][1];
  for(let k=0;k<s.length-1;k++){if(t>=s[k][0]&&t<=s[k+1][0]){const f=(t-s[k][0])/(s[k+1][0]-s[k][0]||1);c=[0,1,2].map(j=>lerp(s[k][1][j],s[k+1][1][j],f));break}}
  const q=(r*256+i)*4;LUT[q]=c[0];LUT[q+1]=c[1];LUT[q+2]=c[2];LUT[q+3]=255}});

const PACES=[{name:'Slow',k:1.3},{name:'Film',k:1},{name:'Brisk',k:.78}];

/* ---------- the nine films. Lines are the source's; "*" marks a hero line; the number is the mood ---------- */
const FILMS=[
 {title:'Exodus',lines:[[NOIR,'They told the town it would be a lake by spring.'],[NOIR,'Four hundred people. One road out. Ninety days.'],[DUSK,'Most families took the furniture. Ruth took the church bell.'],[DUSK,'*It rang at every pothole, all the way south.'],[COLD,'The water came in April, right on schedule.'],[DEEP,'They built a new town on higher ground.'],[DRIFT,'*Same bell. Same people come when it rings.']]},
 {title:'Signal',lines:[[COLD,'For forty years the dish listened to nothing.'],[NOIR,'Static. Static. The patient hum of stars.'],[COLD,'Then, on a Tuesday, at 3:14 in the morning,'],[DRIFT,'*it answered.'],[DEEP,'Seven notes. Then silence again.'],[COLD,'We are still arguing about what they meant.'],[DRIFT,'*But none of us have looked away since.']]},
 {title:'Tide',lines:[[COLD,'The diver went down to find the wreck.'],[DEEP,'Past the light. Past the cold. Past the point of sense.'],[DEEP,'And there it was,'],[DRIFT,'*a hundred years asleep, and almost beautiful.'],[DEEP,'She did not take anything.'],[COLD,'Some things you visit. You do not keep.']]},
 {title:'Bloom',lines:[[NOIR,'They told her the soil was dead.'],[NOIR,'Too much salt. Too many seasons of nothing.'],[DEEP,'She planted anyway. One row. Then ten.'],[NOIR,'Three springs of empty dirt and stubbornness.'],[DUSK,'*Then the whole field went gold overnight.'],[BLOOM,'The neighbors call it luck.'],[BLOOM,'*She calls it Tuesday.']]},

/* ---------- figures: every line draws its own Clifford attractor, seeded by its words ---------- */

function fill(a,b,c,d){ // share of a 40x40 grid the orbit touches: thin cycles score low, noise clouds high

  for(let i=0;i<2600;i++){const nx=Math.sin(a*y)+c*Math.cos(a*x),ny=Math.sin(b*x)+d*Math.cos(b*y);x=nx;y=ny;

function figureFor(text){
  const r=rngFrom(text.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()||'blank');let best=null,bs=-1;
  for(let k=0;k<60;k++){
    const sg=()=>r()<.5?-1:1;
    const f=[sg()*(1.25+r()*.95),sg()*(1.25+r()*.95),sg()*(.55+r()*1.2),sg()*(.55+r()*1.2)];
    const s=Math.min(fill(f[0],f[1],f[2],f[3]),fill(f[0]+.08,f[1]-.08,f[2],f[3]));
    const score=s>.42?.42-(s-.42):s;
    if(score>bs){bs=score;best=f}
    if(s>.2&&s<.42)break}
  best.push((r()-.5)*1.2);return best} // [a,b,c,d,rotation]

/* ---------- the film as a timeline ---------- */
